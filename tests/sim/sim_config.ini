# =====================================================================
# LeanGL Win32 屏幕模拟器 —— 默认工况
#
# 这个文件模拟一块典型的 MCU + SPI TFT：
#   - 字库当作放在外部 SPI Flash 上，每次取字模都有读延迟；
#   - 像素带传屏按 SPI/DMA 的速度计算，不是瞬间完成；
#   - CPU 用忙等模拟（裸机没有操作系统可以 Sleep）。
#
# 命令行 --config 可指定别的配置文件，命令行参数优先级高于本文件。
# 所有延迟单位都是微秒；设为 0 表示“主机速度”，用于快速回归。
# =====================================================================

[display]
width = 240
height = 320
; 0 = 自动：按屏幕高度取 1/8
band_lines = 40

[timing]
; 每次从字库取一个字模（模拟外部 SPI Flash 读取）
flash_latency_us = 150
; 字形光栅化（只在没有 unifont_all-18.0.01.hex、走 GDI 回退时生效）
raster_latency_us = 80
; 每块像素带刷新到屏幕（模拟 SPI/DMA 传输）
flush_latency_us = 1200
; 1 = 忙等（裸机），0 = Sleep（让出 CPU）
busy_wait = 1

[font]
; 相对路径按本文件所在目录解析
path = ../assets/unifont_all-18.0.01.hex

[log]
verbose = 0
