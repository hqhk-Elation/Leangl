# =====================================================================
# LeanGL Win32 屏幕模拟器 —— 慢速工况
#
# 用来验证“屏幕还没刷完，脏区又来了”这种最容易出现饥饿的情况：
#   - 320x240 横屏，切成 8 条像素带；
#   - 每条带传输 2.4ms（大约 150KB/s 的 SPI 屏）；
#   - 字库读取 300us/字，接近外部 Flash 随机读的真实量级。
#
# 自检仍然要求所有像素带都被送到屏幕，否则以非 0 退出。
# =====================================================================

[display]
width = 320
height = 240
band_lines = 30

[timing]
flash_latency_us = 300
raster_latency_us = 150
flush_latency_us = 2400
busy_wait = 1

[font]
path = ../assets/unifont_all-18.0.01.hex

[log]
verbose = 0
